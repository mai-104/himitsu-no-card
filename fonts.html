<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>フォント見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Kiwi+Maru:wght@500&family=Kosugi+Maru&family=Klee+One:wght@600&family=Yusei+Magic&family=Hachi+Maru+Pop&family=Mochiy+Pop+One&family=Zen+Kurenaido&family=Kaisei+Decol:wght@700&family=Yomogi&family=RocknRoll+One&family=BIZ+UDPGothic:wght@700&family=Fredoka:wght@500;600&family=Quicksand:wght@700&family=Nunito:wght@800&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:12px;background:#6a5bb5;color:#fff;font-family:sans-serif}
h1{font-size:18px;margin:4px 0 6px}h2{font-size:16px;margin:22px 0 4px;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:4px}
p.n{font-size:12px;opacity:.85;margin:0 0 8px;line-height:1.6}
.f{background:rgba(255,255,255,.12);border-radius:12px;padding:10px;margin:8px 0}
.nm{font-size:12px;opacity:.9;margin-bottom:6px;font-family:sans-serif}
.nm b{font-size:14px}
.ttl{font-size:34px;line-height:1.2}.sub{font-size:16px;margin-top:4px}
.btn{display:inline-block;background:#fff;color:#5f4fb0;border-radius:12px;padding:6px 14px;margin:6px 6px 0 0;font-size:15px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.wc{width:88px;height:70px;background:#F7EED9;border-radius:10px;color:#3a3150;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.wc.t{background:linear-gradient(#fff2c4,#ffd98a);color:#6b3e00}
.pc{width:50px;height:72px;background:#fffdf6;border-radius:7px;color:#2a2440;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pc .r{position:absolute;left:5px;top:2px;font-size:22px}.pc .s{position:absolute;right:5px;top:6px;font-size:14px}.pc .b{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:24px}
.red{color:#d0405c}
</style></head><body>
<h1>フォント見本</h1>
<p class="n">どれも商用でもゲームに使えるフリーフォント（SIL Open Font License）です。気に入ったものの名前を教えてください。<br>※表示されるまで少し時間がかかることがあります。</p>

<h2>① タイトル画面（タイトル・見出し・ボタン）</h2>
<div id="title"></div>

<h2>② グループ分けソリティア（カードの言葉）</h2>
<p class="n">小さいカードに長い言葉も入るので、読みやすさ重視の候補です。</p>
<div id="word"></div>

<h2>③ クラシックソリティア（カードの数字・アルファベット）</h2>
<p class="n">数字とA・J・Q・Kだけなので、英字フォントも選べます。</p>
<div id="classic"></div>

<script>
const T=[['Zen Maru Gothic',900,'やさしい丸ゴシック。今のふんいきに近い'],['M PLUS Rounded 1c',800,'太めの丸ゴシック。元気で読みやすい'],['Kiwi Maru',500,'少し手書きっぽい丸文字。あたたかい'],['Yusei Magic',400,'マーカーで書いたような文字。かわいい'],['Hachi Maru Pop',400,'ころんとした丸文字。いちばんポップ'],['Mochiy Pop One',400,'太くてころっとした文字。目立つ'],['Klee One',600,'えんぴつ書き風。上品で落ち着く'],['Zen Kurenaido',400,'筆ペン風のやわらかい手書き'],['Kaisei Decol',700,'飾りのある明朝体。おとぎ話っぽい'],['Yomogi',400,'細めの手書き。ゆるくて素朴'],['RocknRoll One',400,'丸みのある太字。ゲームらしい']];
const W=[['Zen Maru Gothic',700,'丸ゴシック。小さくてもくっきり'],['M PLUS Rounded 1c',700,'丸ゴシック。字の形が整っていて読みやすい'],['Kiwi Maru',500,'少し手書き感。絵本っぽい'],['Kosugi Maru',400,'シンプルな丸ゴシック。細め'],['Klee One',600,'えんぴつ書き風。やさしい'],['BIZ UDPGothic',700,'読みやすさを考えて作られたゴシック']];
const C=[['Zen Maru Gothic',900,'丸ゴシック。日本語の部分とそろう'],['M PLUS Rounded 1c',800,'太めの丸ゴシック'],['Fredoka',600,'英字専用。丸くてかわいい'],['Quicksand',700,'英字専用。細めでおしゃれ'],['Nunito',800,'英字専用。丸くて太め'],['Cinzel Decorative',700,'英字専用。クラシックなトランプ風']];
const WORDS=['ショートケーキ','ブロッケン現象','うどん','ステゴサウルス','天の川'];
const box=(f,w,d,html)=>`<div class="f" style="font-family:'${f}',sans-serif;font-weight:${w}"><div class="nm"><b>${f}</b>　${d}</div>${html}</div>`;
document.getElementById('title').innerHTML=T.map(([f,w,d])=>box(f,w,d,`<div class="ttl">秘密のカード</div><div class="sub">クラシック ソリティア／グループ分け ソリティア</div><span class="btn">はじめから</span><span class="btn">つづきから</span><span class="btn">ふつう</span>`)).join('');
document.getElementById('word').innerHTML=W.map(([f,w,d])=>box(f,w,d,`<div class="row">${WORDS.map(x=>`<div class="wc" style="font-size:${x.length>6?12:15}px">${x}</div>`).join('')}<div class="wc t">恐竜</div></div>`)).join('');
const PC=[['A','♠',''],['K','♥','red'],['Q','♣',''],['J','♦','red'],['10','♠',''],['7','♥','red']];
document.getElementById('classic').innerHTML=C.map(([f,w,d])=>box(f,w,d,`<div class="row">${PC.map(([r,s,c])=>`<div class="pc ${c}"><span class="r">${r}</span><span class="s">${s}</span><span class="b">${s}</span></div>`).join('')}</div>`)).join('');
</script></body></html>

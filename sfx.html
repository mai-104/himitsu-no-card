<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>効果音の試聴</title>
<style>
body{margin:0;padding:16px;background:linear-gradient(#cdeaff,#fff3e3);min-height:100vh;font-family:"Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;color:#4a4060}
h1{font-size:20px;margin:4px 0 4px}
p.note{font-size:13px;margin:0 0 14px;opacity:.8}
h2{font-size:15px;margin:18px 0 8px}
.item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.7);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.item button{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:#7fd1b8;color:#fff;font-size:22px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.item button:active{transform:scale(.94)}
.t{font-weight:700;font-size:15px}
.d{font-size:12px;opacity:.75;margin-top:2px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;margin-left:6px;vertical-align:1px}
.both{background:#d6f2e8;color:#2f7d66}.word{background:#ffe2d9;color:#b0563c}.classic{background:#e3e0ff;color:#5a4cae}
</style>
</head>
<body>
<h1>効果音の試聴（マリン作）</h1>
<p class="note">ボタンを押すと音が鳴ります。音が出ないときは、スマホのマナーモードと音量を確かめてください。</p>
<div id="list"></div>
<p class="note" id="ver"></p>
<script>
/* 古い音が残らないよう、毎回最新の効果音ファイルを読み込む */
const sc=document.createElement("script");sc.src="sfx.js?v="+Date.now();sc.onload=()=>{document.getElementById("ver").textContent="効果音ファイル："+SFX.list.length+"種類を読み込みました（"+(SFX.list.includes("clearL")?"最新版":"古い版")+"）"};document.head.appendChild(sc);
</script>
<script>
const L=[
 ['考え中：クリアのファンファーレ',[
  ['clearL','案L','たたたらったら〜んっ ＋ きらきら','both'],
  ['clearK','案K（J＋ぱんぱかぱーん）','上がる → 上がる → ぱんぱかぱーん → きらきら','both'],
  ['clearI','案I（Fの3回目を今の案に）','上がる → 上がる → 今の案（上がってきらきら）','both'],
  ['clearJ','案J（Iの3回目を高く始める）','上がる → 上がる → 高いところから上がってきらきら','both'],
  ['clearG','案G（今の案＋D）','上がる → ぱんぱかぱーん → きらきら','both'],
  ['clearH','案H（D＋今の案）','ぱんぱかぱーん → 上がる → きらきら','both'],
  ['clearD','案D','ぱんぱかぱーん（短・短・短・長）＋きらきら','both'],
  ['clearE','案E','ソ・ラ・シ・レー・シ・レーー（歌うようなメロディ）','both'],
  ['clearF','案F','3回、だんだん高く上がる','both'],
  ['clear','今の案','上がっていって、きらきらが響く','both'],
  ['group','くらべる用：グループがそろう','きらきら','both'],
 ]],
 ['確定した音',[
  ['flip','山からカードをめくる','ぺらっ','both'],
  ['recycle','めくったカードを山に戻す','しゅっ','both'],
  ['place','カードを下の列に置く','ぽん（低め）','both'],
  ['found','カードを上の置き場に置く','ぽん（明るめ）','both'],
  ['ng','置けない場所に動かした','ぽ・ぽ','both'],
  ['reveal','伏せたカードが表になる','ぽわっ','both'],
  ['title','タイトルを置き場に置く','ぽ・ぽーん','word'],
  ['group','グループがそろう／マークが K までそろう','きらきら','both'],
  ['shuffle','シャッフル','しゃらしゃら','both'],
  ['hint','ヒント','ぴこっ','both'],
  ['undo','ひとつ戻る','しゅるっ','both'],
  ['pause','一時停止・再開','かちっ','both'],
  ['stuck','進めないお知らせ','ぽろん','both'],
  ['nudge','「ヒントも使えるよ!!」','ぴろん','both'],
 ]],
];
const TAG={both:['両方','both'],word:['グループ分けだけ','word'],classic:['クラシックだけ','classic']};
const box=document.getElementById('list');
L.forEach(([h,items])=>{
 box.insertAdjacentHTML('beforeend',`<h2>${h}</h2>`);
 items.forEach(([k,t,d,g])=>{
  box.insertAdjacentHTML('beforeend',`<div class="item"><button data-k="${k}">▶</button><div><div class="t">${t}<span class="tag ${TAG[g][1]}">${TAG[g][0]}</span></div><div class="d">${d}</div></div></div>`);
 });
});
box.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&window.SFX)SFX.play(b.dataset.k)});
</script>
</body>
</html>
